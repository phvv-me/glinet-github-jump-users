name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build package feed
        run: pnpm feed
      - name: Read and verify version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          control_version=$(sed -n 's/^Version: //p' package/CONTROL/control)
          test "$version" = "$control_version"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare release assets
        if: steps.release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="dist/feed/glinet-github-jump-users_${VERSION}_all.ipk"
          test -f "$artifact"
          cp "$artifact" dist/feed/glinet-github-jump-users_all.ipk
          cd dist/feed
          sha256sum "glinet-github-jump-users_${VERSION}_all.ipk" glinet-github-jump-users_all.ipk > SHA256SUMS
      - name: Attest release assets
        if: steps.release.outputs.exists == 'false'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/feed/*.ipk
            dist/feed/Packages
            dist/feed/Packages.gz
            dist/feed/SHA256SUMS
      - name: Publish GitHub release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            dist/feed/glinet-github-jump-users_${VERSION}_all.ipk \
            dist/feed/glinet-github-jump-users_all.ipk \
            dist/feed/Packages \
            dist/feed/Packages.gz \
            dist/feed/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "glinet-github-jump-users $VERSION" \
            --generate-notes
