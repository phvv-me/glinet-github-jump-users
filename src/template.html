<div class="github-jump-users">
  <gl-title title="GitHub Jump Users">
    <gl-button
      class="main-action"
      type="primary"
      :loading="working"
      @click="syncUsers"
    >
      Sync GitHub keys
    </gl-button>
  </gl-title>

  <gl-tips
    class="layout-notice"
    tips="Assign GitHub SSH keys to the fixed root or restricted jump account."
    sign="none"
  />

  <gl-tips
    v-if="error"
    class="layout-notice"
    :tips="error"
    state="error"
  />

  <gl-button v-if="loading" :loading="true" disabled>
    Loading access list
  </gl-button>

  <template v-else>
      <el-tabs v-model="activeAccount" class="is-card access-tabs" type="card">
        <el-tab-pane
          v-for="account in status.accounts"
          :key="account.username"
          :label="`${account.username} (${account.members.length})`"
          :name="account.username"
        >
          <div class="account-pane">
            <gl-tips
              class="account-summary"
              :tips="account.mode === 'admin'
                ? `${account.label}. Full router administration.`
                : `${account.label}. Restricted jump access to reachable SSH targets.`"
              :state="account.mode === 'admin' ? 'warning' : 'success'"
              sign="status"
            />

            <div class="member-list-title">
              <span>GitHub users</span>
              <span class="btn-text" @click="showAddDialog(account.username)">
                <span class="iconfont icon-plus"></span>
                Add GitHub user
              </span>
            </div>

            <gl-table :data="account.members" empty-text="No GitHub users assigned">
              <gl-table-column label="GitHub user" min-width="180">
                <template slot-scope="scope">
                  <a
                    :href="`https://github.com/${scope.row.github}`"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    {{ scope.row.github }}
                  </a>
                </template>
              </gl-table-column>
              <gl-table-column label="Keys" min-width="150">
                <template slot-scope="scope">
                  {{ scope.row.key_count }}
                  {{ scope.row.key_types.join(", ") || "pending" }}
                </template>
              </gl-table-column>
              <gl-table-column label="Actions" width="100" align="right">
                <template slot-scope="scope">
                  <gl-dropdown :dropdown-key="`${account.username}-${scope.row.github}`">
                    <gl-dropdown-item @click="showConfig(account, scope.row)">
                      <span class="iconfont icon-set-config"></span>
                      SSH config
                    </gl-dropdown-item>
                    <gl-dropdown-item divided @click="removeMember(account, scope.row)">
                      <span class="iconfont icon-delete"></span>
                      Remove
                    </gl-dropdown-item>
                  </gl-dropdown>
                </template>
              </gl-table-column>
            </gl-table>
          </div>
        </el-tab-pane>
      </el-tabs>

      <el-dialog
        class="member-dialog"
        :visible="showAddUser"
        title="Add GitHub user"
        :close-on-click-modal="false"
        @update:visible="showAddUser = $event"
      >
        <div class="dialog-main">
          <gl-tips
            v-if="activeAccount === 'root'"
            class="dialog-warning"
            tips="This grants full router administration."
            state="warning"
          />
          <el-form ref="memberForm" :model="memberForm">
            <ul class="dialog-form">
              <li>
                <div>GitHub username</div>
                <div>
                  <el-form-item prop="github" :rules="githubRules">
                    <el-input
                      v-model.trim="memberForm.github"
                      maxlength="39"
                      placeholder="GitHub username"
                    />
                  </el-form-item>
                </div>
              </li>
            </ul>
          </el-form>
        </div>
        <template slot="footer">
          <div class="dialog-actions">
            <gl-button class="dialog-button" @click="showAddUser = false">
              Cancel
            </gl-button>
            <gl-button
              class="dialog-button"
              type="primary"
              :loading="working"
              @click="addMember"
            >
              Confirm
            </gl-button>
          </div>
        </template>
      </el-dialog>

      <gl-drawer
        :visible="Boolean(selectedConfig)"
        title="SSH configuration"
        @update:visible="closeConfig"
      >
        <p class="config-title">{{ selectedConfigTitle }}</p>
        <p class="config-help">Paste into ~/.ssh/config and replace {target}.</p>
        <el-input
          type="textarea"
          :value="selectedConfig"
          readonly
          :autosize="{ minRows: 8, maxRows: 18 }"
        />
        <template slot="footer">
          <div class="drawer-actions">
            <gl-button class="dialog-button" @click="closeConfig">Close</gl-button>
            <gl-button class="dialog-button" type="primary" @click="copyConfig">
              Copy
            </gl-button>
          </div>
        </template>
      </gl-drawer>
  </template>
</div>
